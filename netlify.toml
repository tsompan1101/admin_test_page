[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Es una SPA: cualquier ruta (/mapa, /cronograma...) sirve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# config.json (URL de la API) nunca debe quedar en caché.
[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
